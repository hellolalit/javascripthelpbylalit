<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Weather App</title>
	<link rel="stylesheet" href="css/style.css" />
</head>

<body>
	<div class="container">
		<!-- Header -->
		<header class="header">
			<div class="header__top">
				<h1 class="header__title">Weather</h1>
				<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌙</button>
			</div>
		</header>

		<!-- Search Component -->
		<div class="search-box">
			<input type="text" class="search-box__input" placeholder="Search city..." spellcheck="false"
				id="searchInput" />
			<button class="search-box__btn" id="searchBtn" aria-label="Search">🔍</button>
		</div>

		<!-- Error Message -->
		<div class="error-msg" id="errorMsg"></div>

		<!-- Weather Card -->
		<section class="weather-card" id="weatherCard">
			<!-- Weather Icon -->
			<img src="assets/images/clouds.png" alt="weather icon" class="weather-card__icon" id="weatherIcon" />

			<!-- Main Info -->
			<div class="weather-card__main">
				<h2 class="weather-card__temp" id="temp">--°C</h2>
				<h3 class="weather-card__city" id="city">--</h3>
				<p class="weather-card__desc" id="description">--</p>
			</div>

			<!-- Details Grid -->
			<div class="weather-details">
				<div class="detail-item">
					<span class="detail-item__icon">💧</span>
					<div class="detail-item__content">
						<p class="detail-item__label">Humidity</p>
						<p class="detail-item__value" id="humidity">--%</p>
					</div>
				</div>

				<div class="detail-item">
					<span class="detail-item__icon">💨</span>
					<div class="detail-item__content">
						<p class="detail-item__label">Wind</p>
						<p class="detail-item__value" id="wind">-- m/s</p>
					</div>
				</div>

				<div class="detail-item">
					<span class="detail-item__icon">🌡️</span>
					<div class="detail-item__content">
						<p class="detail-item__label">Feels Like</p>
						<p class="detail-item__value" id="feelsLike">--°C</p>
					</div>
				</div>

				<div class="detail-item">
					<span class="detail-item__icon">👁️</span>
					<div class="detail-item__content">
						<p class="detail-item__label">Visibility</p>
						<p class="detail-item__value" id="visibility">-- km</p>
					</div>
				</div>
			</div>
		</section>
	</div>

	<script src="js/app.js"></script>
</body>

</html>
