<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Taking App</title>
    <link rel="preconnect" href="https://fonts.bunny.net">

    <!--Bunny Font Public Sans-->
    <link
        href="https://fonts.bunny.net/css?family=public-sans:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- Root CSS-->
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <main class="note-app">
        <header>
            <nav>
                <span class="left">
                    <img src="https://ik.imagekit.io/tujsl2f24/Note%20Web%20App/logo.png?updatedAt=1752646929379"
                        alt="Logo">
                    Noteit
                </span>
                <span>
                    <ul>
                        <li>All Notes</li>
                        <li>Categories</li>
                        <li>Settings</li>
                    </ul>
                </span>
            </nav>
            <section class="note-body">
                <div class="search-bar">
                    <input type="text" name="search-bar" placeholder="Search your notes">
                    <button class="search-btn">
                        Search
                    </button>
                </div>
                <div class="notes-container">
                    <div class="notes-heading">
                        <h2>My Notes</h2>
                    </div>
                    <div class="notes">
                        <div class="status">
                            <p>Completed</p>
                        </div>
                    </div>
                </div>
            </section>
        </header>
    </main>
</body>

</html>
